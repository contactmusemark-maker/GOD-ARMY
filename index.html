<!DOCTYPE html>
<!--
==============================================================================
ARMY FITNESS CENTRE - SMART GYM ATTENDANCE   (README + BACKEND REFERENCE)
Single-file frontend. Live site: https://godarmy.vercel.app/
No secrets are stored in this file. Only the public Supabase URL and anon key.
==============================================================================

1. HOW THE APP IS BUILT
- One file: index.html (HTML + CSS + JS module). Logo (PNG) and the Ragick
  heading font are embedded as base64. Icons are inline SVG (ICONS map in JS).
- CDN libraries: supabase-js 2.45.4, qrcode-generator 1.4.4, jsPDF 2.5.1,
  jspdf-autotable 3.8.2. Fonts: Google Fonts (Barlow, Barlow Condensed).
- Routing: query string ?view=NAME, handled by route() and the views map.
- Backend: Supabase (Postgres + Auth + Realtime + Edge Functions).
- Config line (near top of the script): SUPABASE_URL, SUPABASE_KEY.
  Use the anon/publishable key ONLY. Never the service_role key.

2. ROUTES (open as https://godarmy.vercel.app/?view=NAME)
Member:  home (default), onboarding, checkin, help
Admin:   admin (login), dashboard, members, attendance, reports, security,
         notifications, qr (printable permanent gate QR; kiosk is an alias)
The admin login address is not linked from member screens. Bookmark it:
  https://godarmy.vercel.app/?view=admin

3. ADMIN LOGIN
- Admin ID GA-001 is mapped to the Supabase Auth email
  ga-001@admin.armyfitness.local (ADMIN_EMAIL_DOMAIN in the script).
- The admin_profiles row links the auth user to the admin code.
- First login forces a password change (must_change_password = true).
- RESET PASSWORD (SQL Editor):
    update auth.users set encrypted_password = crypt('TempPass#2026', gen_salt('bf'))
    where email = 'ga-001@admin.armyfitness.local';
    update admin_profiles set must_change_password = true where admin_code = 'GA-001';
- ADD ANOTHER ADMIN: Auth > Users > add NAME@admin.armyfitness.local, then
    insert into admin_profiles(user_id, admin_code)
    select id, 'GA-002' from auth.users where email = 'ga-002@admin.armyfitness.local';

4. DATABASE TABLES (see setup.sql for the full script)
All tables have Row Level Security ON. The browser (anon key) can only act as
an admin: policies use is_admin(), which checks admin_profiles for auth.uid().
Members never touch tables directly. Edge Functions use the service role.
- admin_profiles: user_id (PK, auth.users), admin_code (unique), must_change_password.
- members: id (uuid), member_code (AFC-0001 style, from member_seq), full_name,
  phone, status (active/inactive/expired), start_date, expiry_date, notes,
  activated (true once PIN is created), created_at.
- member_credentials: member_id (PK), pin_hash (salt:hash, PBKDF2), failed,
  locked_until, updated_at. Not readable from the browser.
- member_activation_tokens: member_id, code_hash (sha256 of member_id:code),
  expires_at (24h), used_at, attempts (max 5).
- gym_qr_challenges: token_hash, issued_at, expires_at. UNUSED now (QR is permanent).
- attendance_records: member_id, attendance_date (IST date), checked_in_at,
  status (present/pending/rejected). UNIQUE(member_id, attendance_date) means
  one attendance per member per day.
- pending_approvals: member_id, reason, state (pending/approved/rejected),
  decided_by, created_at.
- security_events: member_id, reason, risk (low/medium/high), outcome, created_at.
- checkin_attempts: member_id, ok, ip, created_at. Used for search rate limiting
  (rows with member_id null are searches).
- admin_notifications: title, body, read, created_at. Shown in the bell list and
  also pushed to Telegram.
- attendance_audit_logs: actor, action, reason, created_at (approval decisions).
- gym_settings: single row id = 1, data jsonb. Current keys:
    lat, lng, radius (metres) for the location check, e.g.
    {"lat":13.105185,"lng":80.245527,"radius":150}
  Update:  insert into gym_settings(id,data) values (1,'{...}')
           on conflict (id) do update set data = excluded.data;
- Realtime is enabled for attendance_records and admin_notifications.

5. EDGE FUNCTIONS (Supabase > Edge Functions). Called by api(name, body).
Errors return JSON {code, message}; the app reads code.
- member-search {q}: public. Needs 3+ chars. 30 searches/min per IP. Returns max 5
  active members as {id, name, code, activated}. No phone or PIN data.
- member-activate {member_id, code, pin}: checks activation code (unused, not
  expired, under 5 tries), rejects weak PINs, stores PBKDF2 hash, sets
  members.activated = true. Error code bad_code / weak_pin.
- checkin {member_id, pin, location}: checks membership active and not expired,
  PIN (5 wrong tries lock 5+ minutes; error codes bad_pin, locked, inactive,
  no_pin), then one attendance per IST day (returns status already with the
  first time). If gym_settings has lat/lng, location outside the radius, not
  shared, or accuracy over 200 m makes the record pending plus a
  pending_approvals row and a security_events row. Otherwise status present.
  Inserts an admin_notifications row. Returns {status: ok|already|pending,
  checked_in_at}.
- issue-activation-code {member_id}: admin only (JWT checked). Makes a 6-digit,
  single-use, 24-hour code. Plain code is returned once and never stored.
- resolve-approval {id, decision: approve|reject}: admin only. Updates the
  approval and the attendance record, writes attendance_audit_logs.
- telegram-notify: called by a Database Webhook on INSERT into
  admin_notifications. Deploy with Verify JWT OFF. It checks the
  x-webhook-secret header, then sends the message to Telegram.
- qr-challenge: no longer used. Safe to delete.
Edit or redeploy a function in the Supabase dashboard; logs are in each
function's Logs tab.

6. SECRETS (Edge Functions > Secrets; never put these in this file)
TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (owner chat: 5855878425),
WEBHOOK_SECRET (must equal the x-webhook-secret header in the webhook).
SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are provided to functions automatically.
If a bot token is ever shown in a screenshot, revoke it with /revoke in @BotFather.

7. MEMBER AND OWNER FLOWS
First visit: search name > onboarding > enter activation code > create PIN >
  confirm PIN > check-in screen.
Return visit: search name > PIN > location prompt > confirm > Mark my attendance.
Owner: Members > add member > Code button (give the 6-digit code privately) >
  member activates. Dashboard shows live feed; Security page handles approvals.

8. QR CODE
The gate QR is permanent and print-ready (?view=qr, Print button, A4). It only
opens https://godarmy.vercel.app/?view=home. It cannot prove someone is inside
the gym. Presence relies on PIN + location check + owner approval.
If the site address changes, reprint the QR.

9. REPORTS
Monthly report: Reports page, month picker, GENERATE REPORT, DOWNLOAD PDF (A4
landscape). P = present, A = absent, a dash = not eligible (before start date,
after expiry, or a future day). Daily CSV and PDF are on the Attendance page.

10. DEPLOY AND UPDATE
- Push index.html to GitHub (git add . / git commit -m "msg" / git push). Vercel
  redeploys automatically; wait for Ready, then hard refresh (Ctrl+Shift+R).
- To change colours or fonts, edit the CSS variables under :root at the top.
- To change a screen, find its view function (viewHome, viewCheckin,
  viewDashboard, viewMembers, viewAttendance, viewReports, viewSecurity,
  viewNotifications, viewQrPoster).
- To add a new page: write a viewX function, add it to the views map, and add it
  to the nav items in chrome() if it needs a bottom-bar button.

11. KNOWN GAPS (not built yet)
Member edit and profile page with calendar, settings screen (gym profile,
change password in-app), passkey/trusted-device checks, reception code,
expired-membership alerts, arrival time in the Telegram message text,
PIN reset by the owner (use the Code button again to re-activate).

12. TROUBLESHOOTING
- "Failed to fetch" / ERR_NAME_NOT_RESOLVED: SUPABASE_URL is still a placeholder.
- "Invalid Admin ID or password": admin user or admin_profiles row is missing,
  or the password is wrong. See section 3.
- "Failed to send a request to the Edge Function": that function is not deployed
  or its name is spelled differently. Names must match section 5 exactly.
- Check-ins always pending: gym_settings coordinates wrong or radius too small.
- No Telegram message: check the webhook header value and the function Logs.
==============================================================================
-->

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:#fff;color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;max-width:100%;overflow-x:hidden}
h1,h2,h3,.btn,.pill b{font-family:Ragick,'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:clamp(34px,10vw,52px);line-height:1;font-weight:800}h2{font-size:28px;font-weight:700}h3{font-size:20px;font-weight:700}
#app{min-height:100dvh;padding:calc(84px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));max-width:760px;margin:auto}
#app.bare{padding-top:calc(24px + env(safe-area-inset-top))}
.pill{position:fixed;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.07);z-index:20;display:flex;align-items:center}
#top{top:calc(12px + env(safe-area-inset-top));padding:6px 14px 6px 8px;gap:10px;width:min(92vw,420px)}
#top img{height:40px}#top b{font-size:20px;flex:1}
#bot{bottom:calc(12px + env(safe-area-inset-bottom));padding:6px;gap:2px;width:min(94vw,460px);justify-content:space-between}
#bot a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px;border-radius:999px;font-size:12px;font-weight:600;color:#555;text-decoration:none;position:relative;cursor:pointer}
#bot a.on{color:var(--red)}#bot a.on::after{content:"";position:absolute;bottom:1px;width:18px;height:3px;border-radius:3px;background:var(--red)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px}.row .grow{flex:1;min-width:0}
.muted{color:#666}.sm{font-size:14px}.center{text-align:center}
.btn{display:flex;width:100%;justify-content:center;align-items:center;gap:8px;min-height:54px;border:0;border-radius:16px;background:var(--red);color:#fff;font-size:20px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.alt{background:var(--off);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5}
input,select{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:16px;padding:0 16px;font:inherit;background:var(--off);margin-top:10px}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.av{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--off)}.tag.ok{background:#dcfce7;color:var(--ok)}.tag.no{background:#fee2e2;color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.big{font:800 40px Ragick,'Barlow Condensed'}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0}.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink)}.dots i.f{background:var(--red);border-color:var(--red)}
.dots.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:auto}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 26px Ragick,'Barlow Condensed';cursor:pointer}.pad button:active{background:var(--off)}
.hero{display:block;margin:6px auto 18px;width:min(60vw,240px)}
.shield{width:120px;height:120px;margin:16px auto;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#fff;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}.shield.bad{background:var(--red)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.spin{width:22px;height:22px;border:3px solid #ddd;border-top-color:var(--red);border-radius:50%;animation:r .8s linear infinite;margin:auto}@keyframes r{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;background:#fff;z-index:99;display:grid;place-content:center;text-align:center;gap:10px;transition:opacity .4s}
#splash img{width:min(64vw,280px);animation:in .8s ease-out both}@keyframes in{from{opacity:0;transform:scale(.9)}}
#splash .bar{height:3px;width:160px;margin:8px auto;background:var(--line);overflow:hidden;border-radius:3px}#splash .bar i{display:block;height:100%;background:var(--red);animation:ld 1.6s ease-out forwards}@keyframes ld{from{width:0}to{width:100%}}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:50;display:none}
#off{display:none;background:var(--red);color:#fff;text-align:center;padding:4px;position:fixed;top:0;left:0;right:0;z-index:60;font-size:14px}
.qrbox{width:min(80vw,380px);margin:14px auto}.qrbox svg{width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}

h1{font-size:clamp(26px,8vw,42px);line-height:1.1;font-weight:400}h2{font-size:24px;font-weight:400}h3{font-size:17px;font-weight:400}
h1,h2,h3,.btn,.big{font-weight:400!important;letter-spacing:.03em}.btn{font-size:17px;box-shadow:0 8px 18px rgba(229,37,42,.25)}.btn.alt{box-shadow:none}
body{background:#fff}body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--red) 50%,var(--blue) 50%);z-index:70}
h1:not(.center)::after{content:"";display:block;width:56px;height:4px;background:var(--gold);margin-top:10px;border-radius:4px}h1.center::after{content:"";display:block;width:56px;height:4px;background:var(--gold);margin:10px auto 0;border-radius:4px}
.card{border-radius:22px;box-shadow:0 4px 18px rgba(25,25,25,.05)}.big{color:var(--ink)}.grid .card:nth-child(odd){border-top:4px solid var(--red)}.grid .card:nth-child(even){border-top:4px solid var(--blue)}
input:focus{border-color:var(--blue);background:#fff}
#bot{background:#191919;border-color:#191919;padding:8px;gap:4px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
#bot a{flex:0 0 auto;min-width:48px;height:48px;flex-direction:row;justify-content:center;gap:10px;padding:0 6px;color:#9a9a9a;transition:all .25s}
#bot a .ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}#bot a .lb{display:none}
#bot a.on{flex:1 1 auto;background:#fff;color:#191919;justify-content:flex-start;padding:0 18px 0 6px;font-size:15px;font-weight:700}
#bot a.on::after{content:none}#bot a.on .ci{background:var(--red);color:#fff}#bot a.on .lb{display:inline}
.poster{text-align:center;padding:10px 0}
@media print{#top,#bot,.noprint,#toast,#off,body::before{display:none!important}#app{padding:0!important}.poster .qrbox{width:15cm}@page{size:A4;margin:12mm}}

#bot{width:max-content;max-width:94vw;min-width:0;padding:7px;gap:4px;justify-content:center;border-radius:999px;background:#191919;border:1px solid #2c2c2c}
#bot a{flex:0 1 46px;min-width:38px;height:46px;padding:0;gap:0;justify-content:center;color:#a3a3a3;font-size:14px;font-weight:600;border-radius:999px}
#bot a:active{transform:scale(.94)}
#bot a .ci{width:46px;height:46px;flex:none;background:none;border-radius:50%}
#bot a.on{flex:0 1 auto;min-width:0;max-width:150px;padding:0 16px 0 0;gap:8px;background:#fff;color:#191919;justify-content:flex-start;font-weight:700}
#bot a.on .ci{width:46px;height:46px;background:var(--red);color:#fff;margin:0}
#bot a .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:360px){#bot a{flex-basis:38px;height:42px}#bot a .ci,#bot a.on .ci{width:42px;height:42px}#bot a.on{padding-right:12px;font-size:13px}}

/* ================= UI REFRESH (design layer; logic untouched) ================= */
:root{--bg:#F4F5F8;--ink2:#2a2a31;--red-d:#C81D22;--red-l:#FDECEC;--blue-l:#E7F4F9;--amber:#F59E0B;--amber-l:#FEF3DC;--ok-l:#E6F6EC;
--sh1:0 1px 2px rgba(20,20,35,.04),0 6px 18px rgba(20,20,35,.06);--sh2:0 2px 6px rgba(20,20,35,.06),0 18px 40px rgba(20,20,35,.12)}
html,body{background:var(--bg)}
body{background-color:var(--bg);background-image:radial-gradient(760px 380px at 100% -60px,rgba(35,139,181,.16),transparent 70%),radial-gradient(640px 340px at -10% -40px,rgba(229,37,42,.11),transparent 70%);background-repeat:no-repeat}
h2{font-size:26px;line-height:1.1}#app>h2:first-child{margin-bottom:4px}
.muted{color:#6b7280}
#app>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#app>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3){animation-delay:.08s}#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
/* top + bottom bars */
#top{background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-color:rgba(20,20,35,.06);box-shadow:var(--sh1)}
#top img{height:34px}#top b{font-size:16px;letter-spacing:.08em}#top>svg{color:#8a8f98}
#bot{box-shadow:0 16px 38px rgba(0,0,0,.3)}
#bot a.on{max-width:176px}#bot a{flex-shrink:1}@media(max-width:380px){#bot a.on .lb{font-size:13px}#bot a:not(.on){flex-basis:40px}#bot a:not(.on) .ci{width:40px}}
#bot a.on .ci{background:linear-gradient(135deg,#f0393e,var(--red-d));box-shadow:0 6px 14px rgba(229,37,42,.45)}
/* hero */
.hero-card{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 26px;color:#fff;background:linear-gradient(140deg,#17171b,#27272e 60%,#17171b);box-shadow:var(--sh2)}
.hero-card::before,.hero-card::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero-card::before{right:-70px;top:-70px;width:240px;height:240px;background:radial-gradient(circle,rgba(229,37,42,.7),transparent 66%)}
.hero-card::after{left:-60px;bottom:-110px;width:240px;height:240px;background:radial-gradient(circle,rgba(35,139,181,.6),transparent 66%)}
.hero-card>*{position:relative;z-index:1}
.hero-card h1{color:#fff;font-size:clamp(28px,8.6vw,40px)}
.hero-card h1::after{margin-top:12px}
.hero-card p{color:rgba(255,255,255,.74);margin-top:12px;max-width:34ch}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:.02em;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);margin-bottom:16px}
.label{font:700 12px/1 Barlow,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7b808a;margin:24px 4px 10px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}
.step{background:#fff;border:1px solid rgba(20,20,35,.06);border-radius:18px;padding:13px 8px 12px;text-align:center;font-size:12.5px;font-weight:600;line-height:1.25;color:#444;box-shadow:var(--sh1)}
.step i{display:grid;place-items:center;width:30px;height:30px;margin:0 auto 7px;border-radius:50%;background:var(--red-l);color:var(--red);font:normal 400 16px Ragick,'Barlow Condensed',sans-serif}
.step:nth-child(2) i{background:var(--blue-l);color:var(--blue)}.step:nth-child(3) i{background:var(--ok-l);color:var(--ok)}
/* cards */
.card{border:1px solid rgba(20,20,35,.06);border-radius:22px;padding:18px;box-shadow:var(--sh1);transition:transform .16s,box-shadow .2s,border-color .2s}
.card.row{padding:13px 15px}
.card[data-id],.card[tabindex]{cursor:pointer}
@media(hover:hover){.card[tabindex]:hover,.card[data-id]:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:rgba(229,37,42,.25)}}
.card[tabindex]:active,.card[data-id]:active{transform:scale(.985)}
.card>svg:last-child:not(:first-child){color:#b5b9c2}
.av{background:linear-gradient(135deg,var(--red),#ff7a5c);box-shadow:0 6px 14px rgba(229,37,42,.28);font:400 18px Ragick,'Barlow Condensed',sans-serif;text-transform:uppercase}
.card:nth-child(3n+2) .av{background:linear-gradient(135deg,var(--blue),#53c3ea);box-shadow:0 6px 14px rgba(35,139,181,.3)}
.card:nth-child(3n) .av{background:linear-gradient(135deg,#2b2b33,#4a4a55);box-shadow:0 6px 14px rgba(25,25,25,.25)}
#pa{background:var(--red-l);border-color:rgba(229,37,42,.35);color:var(--red-d)}
.empty{display:grid;justify-items:center;gap:6px;text-align:center;padding:30px 16px;color:#7b808a;background:#fff;border:1.5px dashed #dfe2e8;border-radius:22px;font-weight:600}
.empty small{font-weight:400;font-size:13px}.empty svg{opacity:.5}
/* buttons */
.btn{min-height:56px;border-radius:18px;background:linear-gradient(180deg,#f23b40,var(--red-d));box-shadow:0 12px 24px rgba(229,37,42,.28),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .12s,filter .2s,box-shadow .2s}
.btn:active{transform:scale(.975)}@media(hover:hover){.btn:hover{filter:brightness(1.06)}}
.btn.alt{background:#fff;color:var(--ink);border:1px solid rgba(20,20,35,.08);box-shadow:var(--sh1)}
.btn.ghost{background:transparent;border:0;box-shadow:none;color:#6b7280;min-height:46px;font-size:15px;margin-top:6px}
.btn:disabled{opacity:.55;filter:grayscale(.2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions .btn{margin-top:0;font-size:14px;min-height:52px;padding:0 8px;text-align:center}
.row>.btn{margin-top:14px;min-height:48px;font-size:15px}
/* inputs */
input,select{background:#fff;border:1.5px solid #E2E5EB;border-radius:16px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(35,139,181,.16)}
input::placeholder{color:#9aa0aa}
.sbox{position:relative}.sbox input{margin-top:0;min-height:58px;padding-left:50px;border-radius:18px;font-size:17px;box-shadow:var(--sh1)}
.sbox .si{position:absolute;left:17px;top:0;bottom:0;display:flex;align-items:center;color:#8a8f98;pointer-events:none}
/* tags, segmented */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.tag.ok{background:var(--ok-l)}.tag.no{background:var(--red-l)}
button.tag{border:1px solid #E2E5EB;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:all .15s}button.tag:active{transform:scale(.95)}
#ml .card.row{flex-wrap:wrap}#ml .card.row .grow{flex:1 1 130px}
.seg{display:flex;background:#E6E8EE;border-radius:15px;padding:4px;gap:4px;margin:8px 0 12px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font:600 14px Barlow,system-ui,sans-serif;color:#5b606b;cursor:pointer;transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh1)}
/* PIN */
.who{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid rgba(20,20,35,.06);border-radius:20px;padding:12px 14px;margin:18px 0 0;box-shadow:var(--sh1)}
.who .grow{min-width:0}
.dots{gap:16px;margin:26px 0 28px}
.dots i{width:16px;height:16px;border:2px solid #C5C9D1;transition:transform .2s cubic-bezier(.3,1.7,.5,1),background .15s,box-shadow .2s}
.dots i.f{background:var(--red);border-color:var(--red);transform:scale(1.18);box-shadow:0 0 0 5px rgba(229,37,42,.14)}
.pad{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:264px}
.pad button{height:auto;aspect-ratio:1/1;width:100%;display:grid;place-items:center;background:#fff;border:1px solid rgba(20,20,35,.07);box-shadow:var(--sh1);font-size:28px;font-weight:400;color:var(--ink);transition:transform .08s,background .15s,color .15s}
.pad button:active{transform:scale(.92);background:var(--red-l);color:var(--red)}
.pad button[data-k=ok]{background:var(--ink);color:#fff;border-color:var(--ink)}.pad button[data-k=back]{color:#6b7280}
/* confirm summary */
.sum{padding:4px 16px}
.sr{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.sr:last-child{border-bottom:0}
.sr .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--off);color:var(--ink);flex:none}
.sr .ico.b{background:var(--blue-l);color:var(--blue)}.sr .ico.g{background:var(--ok-l);color:var(--ok)}.sr .ico.w{background:var(--amber-l);color:#B76E00}
.sr small{display:block;color:#7b808a;font-size:12.5px;font-weight:500}.sr b{font-size:16px;font-weight:600}
/* result screens */
.shield{position:relative;width:128px;height:128px;margin:26px auto 22px;background:linear-gradient(135deg,var(--blue),#37b6e3);box-shadow:0 20px 44px rgba(35,139,181,.38)}
.shield::before,.shield::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(35,139,181,.28);animation:ring 2.4s ease-out infinite}.shield::after{animation-delay:1.2s}
.shield.bad{background:linear-gradient(135deg,var(--red),#ff7a5c);box-shadow:0 20px 44px rgba(229,37,42,.35)}.shield.bad::before,.shield.bad::after{border-color:rgba(229,37,42,.3)}
.shield.wait{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 20px 44px rgba(245,158,11,.38)}.shield.wait::before,.shield.wait::after{border-color:rgba(245,158,11,.32)}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.55);opacity:0}}
.center>p{max-width:360px;margin:12px auto 0;color:#444;line-height:1.55}
.center h1{margin-top:4px}
/* dashboard */
.ratecard{display:flex;align-items:center;gap:20px;margin-top:14px;padding:18px 20px;background:linear-gradient(140deg,#17171b,#2a2a32);color:#fff;border:0;box-shadow:var(--sh2)}
.ring{--p:0;position:relative;width:98px;height:98px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--red) calc(var(--p)*1%),rgba(255,255,255,.15) 0)}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:#212128}.ring b{position:relative;font:400 26px Ragick,'Barlow Condensed',sans-serif}
.ratecard .muted{color:rgba(255,255,255,.66)}.ratecard .big{color:#fff;font-size:42px;line-height:1.05}.big small{font-size:20px;opacity:.55}
.stats{margin-top:12px;gap:12px}
.grid .card{border-top:0!important;padding:16px}
.stat .si{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.stat.s1 .si{background:var(--blue-l);color:var(--blue)}.stat.s2 .si{background:var(--ok-l);color:var(--ok)}.stat.s3 .si{background:var(--amber-l);color:#B76E00}.stat.s4 .si{background:var(--red-l);color:var(--red)}
.stat .big{font-size:36px;line-height:1}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);letter-spacing:.1em}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}100%{box-shadow:0 0 0 9px rgba(22,163,74,0)}}
.label.row{gap:0;margin-top:26px}
/* tables */
table{font-size:13.5px}th{position:sticky;top:0;background:#fafbfc;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;white-space:nowrap}td{white-space:nowrap}
/* login */
.login{margin-top:5vh;background:#fff;border:1px solid rgba(20,20,35,.06);border-radius:30px;padding:26px 22px 24px;box-shadow:var(--sh2);max-width:440px;margin-inline:auto}
.login .hero{width:min(46vw,170px);margin-bottom:14px}.login h1{font-size:clamp(24px,7vw,32px)}
/* toast, splash */
#toast{background:rgba(25,25,25,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:var(--sh2);font-weight:600;font-size:14px;max-width:90vw;text-align:center;animation:rise .25s ease both}
#splash{background:radial-gradient(520px 320px at 90% 0,rgba(35,139,181,.16),transparent 70%),radial-gradient(520px 320px at 0 100%,rgba(229,37,42,.12),transparent 70%),#fff}
#splash h2{font-size:22px;letter-spacing:.08em}
/* desktop */
@media(min-width:900px){#app{max-width:860px}.stats{grid-template-columns:repeat(4,1fr)}.steps{gap:14px}.hero-card{padding:30px 32px 34px}}
@media(max-width:360px){.pad{max-width:232px}.stats .big{font-size:30px}.ring{width:84px;height:84px}}
@media print{.login,.card{box-shadow:none}}

/* ===== PIN SCREEN v2 ===== */
.pin-card{background:#fff;border:1px solid rgba(20,20,35,.06);border-radius:28px;padding:14px 14px 16px;margin-top:16px;box-shadow:var(--sh2)}
.pin-card .who{background:var(--bg);border:0;box-shadow:none;margin:0;padding:10px 12px;border-radius:18px}
.pin-card .who .sm{display:flex;align-items:center;gap:5px}
.pin-card .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:14px;justify-content:center;width:max-content;max-width:100%;margin:18px auto 16px;padding:13px 22px;border-radius:99px;background:var(--bg)}
.dots i{width:14px;height:14px;border:2px solid #C5C9D1;background:transparent}
.dots i.f{background:var(--red);border-color:var(--red);transform:scale(1.15);box-shadow:0 0 0 4px rgba(229,37,42,.14)}
.pad{max-width:none;margin:0;gap:10px}
.pad button{height:58px;aspect-ratio:auto;width:100%;border-radius:18px;background:#F4F5F8;border:0;box-shadow:none;font-size:26px;color:var(--ink)}
.pad button:active{background:var(--red-l);color:var(--red);transform:scale(.95)}
.pad button[data-k=back]{background:transparent;color:#6b7280}
.pad button[data-k=ok]{background:linear-gradient(180deg,#f23b40,var(--red-d));color:#fff;box-shadow:0 8px 18px rgba(229,37,42,.3)}
.pad button[data-k=ok]:active{color:#fff;filter:brightness(.92)}
.pin-note{text-align:center;font-size:12.5px;color:#9aa0aa;margin-top:12px}
@media(max-width:360px){.pad{max-width:none}.pad button{height:52px;font-size:24px}.dots{gap:11px;padding:11px 18px}}

/* ===== AVATARS & PROFILE FORM ===== */
.av.img{background:none!important;box-shadow:0 4px 12px rgba(20,20,35,.2)!important;overflow:hidden;padding:0}
.av.img img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:68px;height:68px;font-size:28px}
.avprev{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avo{position:relative;aspect-ratio:1;border:0;padding:3px;border-radius:50%;background:transparent;cursor:pointer;transition:transform .15s,background .15s}
.avo img{width:100%;height:100%;border-radius:50%;display:block}
.avo:active{transform:scale(.9)}.avo:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.avo.on{background:linear-gradient(135deg,var(--red),var(--blue));transform:scale(1.07)}
.avo.on::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font:700 12px/1 Barlow,sans-serif;display:grid;place-items:center;border:2px solid #fff}
.fl{display:block;font-size:13px;font-weight:600;color:#555;margin:16px 2px -4px}
.two{display:grid;grid-template-columns:1fr 1.7fr;gap:10px}.two>div{min-width:0}
.pfxbox{position:relative}.pfxbox span{position:absolute;left:16px;top:10px;bottom:0;display:flex;align-items:center;color:#6b7280;font-weight:600;pointer-events:none}.pfxbox input{padding-left:54px}
textarea{width:100%;min-height:96px;border:1.5px solid #E2E5EB;border-radius:16px;padding:12px 16px;font:inherit;background:#fff;margin-top:10px;resize:vertical;transition:border-color .2s,box-shadow .2s}
textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(35,139,181,.16)}
.cnt{text-align:right;font-size:12px;color:#9aa0aa;margin-top:4px}
input[readonly]{background:var(--off);color:#555}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shield.withav{background:#fff;padding:5px}.avbig{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
input[type=date]{min-width:0;padding:0 10px;font-size:15px}
@media(max-width:360px){.avgrid{gap:5px}.two{grid-template-columns:1fr}}

.center h1::after{margin-left:auto;margin-right:auto}
/* ===== JOIN ===== */
.joincta{display:flex;align-items:center;gap:12px;margin-top:20px;background:linear-gradient(135deg,#17171b,#2a2a32);color:#fff;border:0;box-shadow:var(--sh2)}
.joincta .muted{color:rgba(255,255,255,.72)}.joincta .btn{width:auto;margin:0;min-height:46px;padding:0 18px;font-size:15px;flex:none}
.req .fl{margin-top:12px}.req>.row:last-child .btn{margin-top:12px}

const avPicker=()=>`<div class="avprev" data-avp></div><div class="avgrid" role="radiogroup" aria-label="Choose an avatar">${AVATARS.map((a,i)=>`<button type="button" class="avo" data-i="${i}" role="radio" aria-checked="false" aria-label="Avatar ${i+1}"><img src="${a}" alt=""></button>`).join('')}</div>`;
function avWire(root,init=null,name=''){const r=document.querySelector(root);let sel=init;
  const mark=()=>{r.querySelectorAll('.avo').forEach(b=>{const on=+b.dataset.i===sel;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
    r.querySelector('[data-avp]').innerHTML=avImg(sel,name,'xl')+`<div><b>${sel==null?'Pick your avatar':'Looking sharp!'}</b><div class="sm muted">${sel==null?'Tap any picture below':'Tap another to change'}</div></div>`};
  r.querySelectorAll('.avo').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;mark()});mark();return ()=>sel}
const normPh=v=>{let d=String(v||'').replace(/\D/g,'');if(d.length==12&&d.startsWith('91'))d=d.slice(2);if(d.length==11&&d[0]=='0')d=d.slice(1);return /^[6-9]\d{9}$/.test(d)?d:null};

async function api(fn,body){ // all privileged work happens in Supabase Edge Functions
  if(!navigator.onLine) throw {code:'offline',message:'You are offline.'};
  const {data,error}=await sb.functions.invoke(fn,{body});
  if(error){let j={};try{j=await error.context.json()}catch{}throw {code:j.code||'error',message:j.message||error.message,data:j}}
  return data}

function chrome(kind,title='ARMY FITNESS'){
  $('#top').style.display=$('#bot').style.display=kind?'flex':'none';if(!kind)return;
  $('#top').innerHTML=`<img src="${LOGO}" alt=""><b>${title}</b>${kind=='admin'?`<button id="bell" aria-label="Notifications" style="position:relative;background:none;border:0;color:inherit;cursor:pointer">${ic('bell')}<span id="bd" class="tag no" style="display:none;position:absolute;top:-8px;right:-10px;padding:1px 6px"></span></button>`:ic('circle-help')}`;
  if(kind=='admin'){$('#bell').onclick=()=>go('notifications');badge();if(!S.nt)S.nt=sb.channel('nt').on('postgres_changes',{event:'INSERT',schema:'public',table:'admin_notifications'},p=>{toast(p.new.title);badge();if(new URLSearchParams(location.search).get('view')=='notifications')viewNotifications()}).subscribe()}
  const items=kind=='admin'?[['dashboard','layout-dashboard','Dashboard'],['members','users','Members'],['attendance','clipboard-check','Attendance'],['reports','file-text','Reports'],['security','shield-alert','Security']]
    :[['home','house','Home'],['checkin','scan-line','Check-In'],['help','circle-help','Help']];
  const cur=new URLSearchParams(location.search).get('view')||'home';
  $('#bot').innerHTML=items.map(([v,i,l])=>`<a tabindex="0" role="link" data-v="${v}" class="${cur==v?'on':''}"><span class="ci">${ic(i,20)}</span><span class="lb">${l}</span></a>`).join('');
  $('#bot').querySelectorAll('a').forEach(a=>a.onclick=()=>go(a.dataset.v));lucide.createIcons()}

async function badge(){const {count}=await sb.from('admin_notifications').select('*',{count:'exact',head:true}).eq('read',false);const b=$('#bd');if(b){b.textContent=count>99?'99+':count;b.style.display=count?'block':'none'}}

/* ===== PIN pad component ===== */
function pinPad(done){
  let v='';const dots=()=>[...Array(6)].map((_,i)=>`<i class="${i<v.length?'f':''}"></i>`).join('');
  $('#pinzone').innerHTML=`<div class="dots" id="dots" aria-label="PIN entry">${dots()}</div><div class="pad">${[1,2,3,4,5,6,7,8,9,'back',0,'ok'].map(k=>`<button data-k="${k}" aria-label="${k}">${k=='back'?ic('delete'):k=='ok'?ic('check'):k}</button>`).join('')}</div>`;lucide.createIcons();
  const upd=()=>$('#dots').innerHTML=dots();
  $('#pinzone').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;try{navigator.vibrate&&navigator.vibrate(8)}catch{}
    if(k=='back')v=v.slice(0,-1);else if(k=='ok'){if(v.length==6)done(v)}else if(v.length<6)v+=k;upd();if(v.length==6&&k!='ok')setTimeout(()=>done(v),150)});
  return {clear(){v='';upd();$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),400)}}}

function joinPin(pr){let first=null;
  const step=()=>{draw(`<h1>${first?'CONFIRM YOUR PIN':'CREATE YOUR GYM PIN'}</h1><p class="muted">${first?'Enter the same PIN again.':'Choose a 6-digit PIN you will remember.'}</p><div class="pin-card"><div id="pinzone"></div></div>`);
    const pp=pinPad(async v=>{
      if(!first){if(weakPin(v)){toast('Choose a less obvious PIN');return pp.clear()}first=v;return step()}
      if(v!==first){first=null;toast('PINs did not match');return step()}
      try{await api('member-register',{...pr,pin:v});S.jd=null;
        screen('clock','REQUEST SENT',`Thanks, ${esc(pr.name.split(' ')[0])}!<br>The gym owner will approve your membership.<br>After that, search your name on the home screen and check in with your PIN.`)}
      catch(e){toast(e.code=='weak_pin'?'Choose a less obvious PIN':e.message||'Could not send request');viewJoin()}})};step()}

function createPin(code,profile){let first=null;

function viewCheckin(){chrome('member');if(!S.member)return go('home');
  draw(`<h1>WELCOME BACK, ${esc(S.member.name.split(' ')[0])}!</h1><p class="muted">Enter your six-digit PIN to continue.</p>
  <div class="pin-card"><div class="who">${avImg(S.member.avatar,S.member.name)}<div class="grow"><b>${esc(S.member.name)}</b><div class="sm muted">${ic('lock',12)} Secure check-in</div></div><button class="tag" id="nm">Not you?</button></div><div id="pinzone"></div><p class="pin-note">Your PIN stays private to you</p></div>

  $('#nm').onclick=()=>{S.member=null;go('home')};
  $('#fg').onclick=()=>toast('Ask the gym owner to reactivate your profile.');
  const pp=pinPad(async v=>{S.pin=v;await prepare(pp)})}
async function prepare(pp){ // location is requested only here, with the browser's own permission prompt
  let loc=null;try{loc=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),no,{timeout:8000}):no())}catch{}
  S.loc=loc;const now=new Date();
  draw(`<h2>CONFIRM YOUR CHECK-IN</h2><p class="muted">Review the details, then mark your attendance.</p><div class="card sum"><div class="sr"><span class="ico">${ic('user-check',20)}</span><div><small>Member</small><b>${esc(S.member.name)}</b></div></div><div class="sr"><span class="ico b">${ic('calendar',20)}</span><div><small>Date</small><b>${dmy(now)}</b></div></div><div class="sr"><span class="ico ${loc?'g':'w'}">${ic('map-pin',20)}</span><div><small>Gym presence</small><b>Verified by the server on submit</b><div class="sm muted">${loc?'Location shared':'Location not shared'}</div></div></div></div>
  <button class="btn" id="go">${ic('check')} MARK MY ATTENDANCE</button>`);
  $('#go').onclick=submit}
async function submit(){const b=$('#go');b.disabled=true;b.innerHTML='<div class="spin"></div>';
  try{const r=await api('checkin',{member_id:S.member.id,pin:S.pin,challenge:S.challenge,location:S.loc});S.pin='';
    if(r.status=='already')return screen('shield','ALREADY CHECKED IN!',`Your attendance is already recorded for today.<br>First Entry: ${tm(r.checked_in_at)}<br>Date: ${dmy(r.checked_in_at)}<br><b>SEE YOU TOMORROW!</b>`);
    if(r.status=='pending')return screen('clock','CHECK-IN PENDING APPROVAL','Your gym owner needs to verify this attendance.');
    screen('shield-check','ATTENDANCE CONFIRMED!',`Welcome back, ${esc(S.member.name)}!<br><b>${dmy(r.checked_in_at)}<br>${tm(r.checked_in_at)}</b><br><br><b>SHOW UP. WORK HARD. REPEAT.</b>`,true)
  }catch(e){S.pin='';
    if(e.code=='expired'||e.code=='no_challenge')return screen('qr-code','QR CODE EXPIRED','Please scan the current QR code displayed inside the gym.',false,'SCAN AGAIN');
    if(e.code=='bad_pin'){toast('Wrong PIN');return viewCheckin()}
    toast(e.code=='locked'?'Too many attempts. Try again later.':e.message);viewCheckin()}}

  <div class="two" style="grid-template-columns:1fr 1fr"><div><label class="fl" for="ns">Start date</label><input id="ns" type="date" value="${ist()}"></div><div><label class="fl" for="ne">Expiry <span class="muted">(optional)</span></label><input id="ne" type="date"></div></div>
  <button class="btn" id="ad">${ic('plus')} ADD MEMBER</button></div>
  <div id="ml">${(data||[]).map(m=>`<div class="card row" data-s="${esc((m.full_name+m.member_code).toLowerCase())}">${avImg(m.avatar,m.full_name)}<div class="grow"><b>${esc(m.full_name)}</b><div class="sm muted">${esc(m.member_code)}${m.age?' · '+m.age+' yrs':''}${m.phone?' · +91 '+esc(m.phone):''}</div>${m.notes?`<div class="sm muted clamp">${esc(m.notes)}</div>`:''}</div><span class="tag ${m.status=='active'?'ok':'no'}">${m.status}</span><button class="tag" data-code="${m.id}">Code</button><button class="tag" data-tog="${m.id}" data-st="${m.status}">${m.status=='active'?'Deactivate':'Reactivate'}</button></div>`).join('')||`<div class="empty">${ic('users',30)}No members yet<small>Add your first one above.</small></div>`}</div>`);
  $('#f').oninput=e=>document.querySelectorAll('#ml [data-s]').forEach(c=>c.style.display=c.dataset.s.includes(e.target.value.toLowerCase())?'':'none');
  const getAv=avWire('#addc',null,'?');
  document.querySelectorAll('[data-sg]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.sg,exp=document.querySelector(`[data-exp="${id}"]`).value||null;
    try{await api('resolve-signup',{id,decision:b.dataset.d,expiry_date:exp});toast(b.dataset.d=='approve'?'Member approved':'Request rejected');viewMembers()}catch(e){b.disabled=false;toast(e.message)}});
  $('#ad').onclick=async()=>{const n=$('#nn').value.trim();if(n.length<2)return toast('Enter the full name');
    const rawPh=$('#np').value.trim(),ph=rawPh?normPh(rawPh):null;if(rawPh&&!ph)return toast('Enter a valid 10-digit mobile number');
    const age=parseInt($('#na').value,10)||null;if(age&&(age<10||age>99))return toast('Enter a valid age (10–99)');
    const av=getAv(),row={full_name:n,start_date:$('#ns').value,expiry_date:$('#ne').value||null,phone:ph,notes:$('#nd').value.trim()||null,status:'active'};
    if(S.prof){row.age=age;row.avatar=av}
    const {error}=await sb.from('members').insert(row);
    if(error)return toast(error.message);
    toast(!S.prof&&(av!=null||age)?'Member added. Run the profile SQL to store avatar & age.':'Member added');viewMembers()};
  document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=async()=>{await sb.from('members').update({status:b.dataset.st=='active'?'inactive':'active'}).eq('id',b.dataset.tog);viewMembers()});
  document.querySelectorAll('[data-code]').forEach(b=>b.onclick=async()=>{try{const r=await api('issue-activation-code',{member_id:b.dataset.code});alert('Activation code: '+r.code+'\nValid for 24 hours, single use. Give it privately to the member.')}catch(e){toast(e.message)}})}

async function viewAttendance(){if(!await requireAdmin())return;chrome('admin','TODAY');loading();chrome('admin','TODAY');const d=ist();
  const [{data:ms},{data:at}]=await Promise.all([sb.from('members').select('id,member_code,full_name'+(S.prof?',avatar':'')).eq('status','active').order('member_code'),sb.from('attendance_records').select('member_id,checked_in_at').eq('attendance_date',d).eq('status','present')]);
  const m=new Map(at.map(a=>[a.member_id,a.checked_in_at])),rows=ms.map(x=>({...x,t:m.get(x.id)}));
  const list=f=>rows.filter(r=>f=='all'||(f=='p')==!!r.t).map(r=>`<div class="card row">${avImg(r.avatar,r.full_name)}<div class="grow"><b>${esc(r.full_name)}</b><div class="sm muted">${esc(r.member_code)} · ${r.t?tm(r.t):'Not checked in'}</div></div><span class="tag ${r.t?'ok':'no'}">${r.t?'PRESENT':'ABSENT'}</span></div>`).join('')||'<div class="empty">Nothing to show</div>';
  draw(`<h2>TODAY'S ATTENDANCE</h2><p class="muted">${dmy(new Date())}</p><div class="row" style="margin:10px 0"><span class="tag ok">Present ${at.length}</span><span class="tag no">Absent ${ms.length-at.length}</span><span class="tag">Eligible ${ms.length}</span></div>
  <div class="seg"><button class="on" data-f="all">All</button><button data-f="p">Present</button><button data-f="a">Absent</button></div><div id="al">${list('all')}</div>
  <button class="btn alt" id="csv">${ic('download')} DOWNLOAD CSV</button><button class="btn alt" id="dpdf">${ic('file-down')} DAILY ATTENDANCE PDF</button>`);
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));$('#al').innerHTML=list(b.dataset.f)});
  const data=rows.map(r=>[r.member_code,r.full_name,d,r.t?tm(r.t):'-',r.t?'Present':'Absent']);
  $('#csv').onclick=()=>{const c=[['Member ID','Name','Date','Time','Status'],...data].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=`attendance-${d}.csv`;a.click()};
  $('#dpdf').onclick=()=>{const doc=new jspdf.jsPDF();doc.addImage(LOGO,'PNG',14,8,30,22);doc.setFontSize(16);doc.text('ARMY FITNESS CENTRE - Daily Attendance '+d,50,20);doc.autoTable({startY:36,head:[['Member ID','Name','Date','Time','Status']],body:data,headStyles:{fillColor:[229,37,42]}});doc.save(`daily-${d}.pdf`)}}

async function viewReports(){if(!await requireAdmin())return;chrome('admin','REPORTS');const n=new Date(),ym=ist().slice(0,7);
  draw(`<h2>MONTHLY REPORT</h2><input id="mo" type="month" value="${ym}" aria-label="Month"><button class="btn" id="gen">GENERATE REPORT</button><div id="out"></div>`);
  $('#gen').onclick=async()=>{const [Y,M]=$('#mo').value.split('-').map(Number),days=new Date(Y,M,0).getDate(),p=x=>String(x).padStart(2,'0'),first=`${Y}-${p(M)}-01`,last=`${Y}-${p(M)}-${p(days)}`;
    $('#out').innerHTML='<div class="spin" style="margin:20px auto"></div>';
    const [{data:ms},{data:at}]=await Promise.all([sb.from('members').select('id,member_code,full_name,start_date,expiry_date').lte('start_date',last).order('member_code'),sb.from('attendance_records').select('member_id,attendance_date').eq('status','present').gte('attendance_date',first).lte('attendance_date',last)]);
    const set=new Set(at.map(a=>a.member_id+a.attendance_date)),today=ist();
    const rows=ms.map(m=>{let pr=0,el=0;const cells=[...Array(days)].map((_,i)=>{const d=`${Y}-${p(M)}-${p(i+1)}`;if(d<m.start_date||(m.expiry_date&&d>m.expiry_date)||d>today)return '—';el++;if(set.has(m.id+d)){pr++;return 'P'}return 'A'});return [m.member_code,m.full_name,...cells,pr,el,el?Math.round(pr/el*100)+'%':'—']});
    const head=[['ID','Name',...[...Array(days)].map((_,i)=>i+1),'Present','Eligible','%']];
    $('#out').innerHTML=`<div class="card" style="overflow-x:auto"><table><tr>${head[0].map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div><button class="btn" id="dl">${ic('download')} DOWNLOAD PDF</button>`;lucide.createIcons();
    $('#dl').onclick=()=>{const doc=new jspdf.jsPDF({orientation:'landscape',format:'a4'});doc.addImage(LOGO,'PNG',10,6,24,18);doc.setFontSize(16);doc.text(`ARMY FITNESS CENTRE - Attendance ${p(M)}/${Y}`,38,14);doc.setFontSize(8);doc.text('Generated '+new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' | Members: '+rows.length,38,20);
      doc.autoTable({startY:28,head,body:rows,styles:{fontSize:6,cellPadding:1},headStyles:{fillColor:[229,37,42]},didDrawPage:d=>doc.text('Page '+d.pageNumber,285,205,{align:'right'})});doc.save(`attendance-${Y}-${p(M)}.pdf`)}}}

async function viewSecurity(){if(!await requireAdmin())return;chrome('admin','SECURITY');
  const [{data:ev},{data:pa}]=await Promise.all([sb.from('security_events').select('id,reason,risk,outcome,created_at,members(full_name)').order('created_at',{ascending:false}).limit(40),sb.from('pending_approvals').select('id,reason,created_at,members(full_name)').eq('state','pending')]);
  draw(`<h2>SECURITY MONITOR</h2><h3>Pending approvals</h3>${(pa||[]).map(a=>`<div class="card"><b>${esc(a.members.full_name)}</b><div class="sm muted">${esc(a.reason)} · ${tm(a.created_at)}</div><div class="row"><button class="btn" data-ap="${a.id}" data-d="approve">APPROVE</button><button class="btn alt" data-ap="${a.id}" data-d="reject">REJECT</button></div></div>`).join('')||'<p class="muted">None waiting.</p>'}
  <h3 style="margin-top:18px">Recent events</h3>${(ev||[]).map(e=>`<div class="card row"><div class="grow"><b>${esc(e.members?.full_name||'Unknown')}</b><div class="sm muted">${esc(e.reason)} · ${tm(e.created_at)} · ${esc(e.outcome)}</div></div><span class="tag ${e.risk=='high'?'no':''}">${esc(e.risk)}</span></div>`).join('')||'<p class="muted">No security events.</p>'}`);
  document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=async()=>{try{await api('resolve-approval',{id:b.dataset.ap,decision:b.dataset.d});toast('Done');viewSecurity()}catch(e){toast(e.message)}})}

/* ===== PERMANENT GATE QR: print-ready, never refreshes ===== */
async function viewQrPoster(){if(!await requireAdmin())return;chrome(null);
  const q=qrcode(0,'M');q.addData(location.origin+location.pathname+'?view=home');q.make();
  draw(`<div class="poster"><img class="hero" src="${LOGO}" alt="Army Fitness Centre"><h1 class="center">SCAN TO MARK ATTENDANCE</h1><div class="qrbox">${q.createSvgTag({scalable:true})}</div><p class="muted">Scan, search your name, enter your PIN.</p><h3>ARMY FITNESS CENTRE</h3></div>
  <div class="noprint"><button class="btn" id="pr">${ic('printer')} PRINT QR POSTER</button><button class="btn alt" id="x">Back to dashboard</button></div>`,{bare:true});
  $('#pr').onclick=()=>print();$('#x').onclick=()=>go('dashboard')}
const viewKiosk=viewQrPoster;

/* ===== Router ===== */
const views={home:viewHome,onboarding:viewOnboarding,checkin:viewCheckin,help:()=>{chrome('member');draw('<h1>NEED HELP?</h1><p class="muted" style="margin-top:10px">Not on the list, or forgot your PIN? Ask the gym owner at the front desk to register or reactivate you.</p>')},
  join:viewJoin,admin:viewAdminLogin,dashboard:viewDashboard,members:viewMembers,attendance:viewAttendance,reports:viewReports,security:viewSecurity,notifications:viewNotifications,kiosk:viewKiosk,qr:viewQrPoster};
function route(){const p=new URLSearchParams(location.search);if(p.get('challenge'))S.challenge=p.get('challenge');
  const v=p.get('view')||'home';if(v=='checkin'&&!S.member&&p.get('challenge'))return viewHome();(views[v]||viewHome)()}
$('#sp').src=LOGO;lucide.createIcons();
const ready=Promise.all([new Promise(r=>setTimeout(r,1700))]);
route();ready.then(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),400)});
</script></body></html>
